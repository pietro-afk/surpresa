<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Tenho algo pra te contar</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: linear-gradient(135deg, #fff0f5, #ffe4e1);
  padding: 40px;
  overflow: hidden;
}

h1 {
  color: #ff4d6d;
  animation: fadeIn 2s ease-in-out;
}

p {
  font-size: 20px;
  animation: fadeIn 3s ease-in-out;
}

button {
  padding: 15px 25px;
  font-size: 18px;
  background: #ff4d6d;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  margin-top: 30px;
  transition: transform 0.2s;
}

button:hover {
  transform: scale(1.1);
}

.hidden {
  display: none;
  margin-top: 30px;
  animation: aparecer 2s ease forwards;
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}

@keyframes aparecer {
  from {
    opacity: 0;
    transform: scale(0.5);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* corações */
.heart {
  position: fixed;
  top: -10px;
  font-size: 20px;
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(110vh);
  }
}
</style>
</head>

<body>

<h1>Darlyson… 💭</h1>

<p>Eu pensei muito em como te contar isso…</p>
<p>Então… clica no botão abaixo 💓</p>

<button onclick="mostrar()">Descobrir</button>

<div id="surpresa" class="hidden">
  <h1>Darlyson… 👶✨</h1>
  <h2>Você vai ser papai!</h2>
  <p>Eu te amo ❤️</p>
  <img src="https://i.imgur.com/2nCt3Sbl.jpg" width="300">
</div>

<script>
function mostrar() {
  document.getElementById("surpresa").style.display = "block";
}

/* corações caindo */
function criarCoracao() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "💖";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 5000);
}

setInterval(criarCoracao, 300);
</script>

</body>
</html>
