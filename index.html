<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Tenho algo pra te contar</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #fff0f5;
  padding: 40px;
}
h1 {
  color: #ff4d6d;
}
p {
  font-size: 20px;
}
.box {
  margin-top: 40px;
}
button {
  padding: 15px 25px;
  font-size: 18px;
  background: #ff4d6d;
  color: white;
  border: none;
  border-radius: 10px;
}
.hidden {
  display: none;
  margin-top: 30px;
}
</style>
</head>

<body>

<h1>Tenho algo pra te contar… 💭</h1>

<p>Eu pensei muito em como te contar isso…</p>
<p>Então… clica no botão abaixo 💓</p>

<div class="box">
<button onclick="mostrar()">Descobrir</button>
</div>

<div id="surpresa" class="hidden">
  <h1>👶✨ Você vai ser papai!</h1>
  <p>Eu te amo ❤️</p>
  <img src="https://i.imgur.com/2nCt3Sbl.jpg" width="300">
</div>

<script>
function mostrar() {
  document.getElementById("surpresa").style.display = "block";
}
</script>

</body>
</html>
